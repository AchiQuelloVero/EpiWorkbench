<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EpiWorkbench</title>
    <link rel="stylesheet" href="./styles/app.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1>EpiWorkbench</h1>
        <div class="app__header-actions">
          <button id="open-prefs" class="btn btn--icon" title="Preferences" aria-label="Preferences">
            ⚙
          </button>
          <button id="pick-folder" class="btn">Select folder…</button>
        </div>
      </header>
      <section class="app__body">
        <p class="selected-path" id="selected-path" data-empty="true">No folder selected</p>
        <div id="toolbar"></div>
        <div id="repo-summary"></div>
        <div id="repo-list-container"></div>
      </section>
    </main>
    <div id="repo-details"></div>
    <div id="preferences"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
